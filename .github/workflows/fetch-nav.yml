# NAV fetch polling alongside the nightly Vercel cron.
#
# The Vercel cron (vercel.json) runs once a day at 17:30 UTC
# (23:15 NPT) as the failure-reporting backstop. Fund managers
# publish the previous day's NAV around 11:05 NPT, so two fixed
# GitHub schedules (09:20 / 11:30 NPT) were tried first - but GitHub
# scheduled workflows are best-effort: they ran five hours late one
# day and did not fire at all the next, leaving the app a day behind
# twice in a row. GitHub Actions on a public repo is free with no
# minute limit, so instead of two critical daily runs the workflow
# now polls every 15 minutes. The endpoint is fully idempotent (DB
# writes are gated on newer dates), so misses and duplicates are
# harmless: the freshest NAV lands within ~15 minutes of publication
# and a dropped trigger is covered by the next poll.
#
# Every poll passes notify=change, so a push goes out only when new
# data was actually found; the night Vercel run (no param) is the
# only one that also reports failures, so a broken source surfaces
# once a day.
#
# Requires the repo secret CRON_SECRET (same value as the Vercel
# env var). GitHub cron is UTC-only; the minimum interval is 5 min.

name: NAV fetch

on:
  schedule:
    - cron: "*/15 * * * *"  # poll every 15 min; nightly Vercel cron backstops
  workflow_dispatch: {}

jobs:
  fetch-nav:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger NAV fetch
        run: |
          code=$(curl -sS -o response.json -w "%{http_code}" --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://sahakari-sip.vercel.app/api/cron/fetch-nav?notify=change")
          cat response.json
          echo ""
          test "$code" = 200
